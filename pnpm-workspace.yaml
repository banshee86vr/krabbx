packages:
  - frontend
  - backend
  - mcp

enablePrePostScripts: true

overrides:
  defu: '>=6.1.5'
  picomatch: '>=4.0.4'
  hono: '>=4.12.25'
  '@hono/node-server': '>=1.19.13'
  postcss: '>=8.5.18'
  shell-quote: '>=1.8.4'
  fast-uri: '>=3.1.2'
  ws: '>=8.21.0'
  qs: '>=6.15.2'
  brace-expansion: '>=5.0.9'
  engine.io: '>=6.6.7'
  socket.io-parser: '>=4.2.7'
  ip-address: '>=10.3.1'
  nanoid@^3: '>=3.3.18'
  vite: '>=8.0.16'
  # 0.28.2 is under pnpm's default 24h minimumReleaseAge; 0.28.1 is the security patch.
  esbuild: 0.28.1
  # 8.23.0 / pg-protocol 1.16.0 are under the same age gate.
  pg: 8.22.0
  pg-protocol: 1.16.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
