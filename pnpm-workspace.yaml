packages:
  - frontend
  - backend
  - mcp

enablePrePostScripts: true

overrides:
  defu: '>=6.1.5'
  picomatch: '>=4.0.4'
  hono: '>=4.12.25'
  '@hono/node-server': '>=1.19.13'
  postcss: '>=8.5.18'
  shell-quote: '>=1.8.4'
  fast-uri: '>=3.1.2'
  ws: '>=8.21.0'
  qs: '>=6.15.2'
  brace-expansion: '>=5.0.9'
  engine.io: '>=6.6.7'
  socket.io-parser: '>=4.2.7'
  ip-address: '>=10.3.1'
  nanoid@^3: '>=3.3.18'
  vite: '>=8.0.16'
  # 0.28.2 is under pnpm's default 24h minimumReleaseAge; 0.28.1 is the security patch.
  esbuild: 0.28.1
  # 8.23.0 / pg-protocol 1.16.0 are under the same age gate.
  pg: 8.23.1
  pg-protocol: 1.16.0
  lucide-react: 1.81.0
  # GHSA-mrhx-c7xc-m3w5: memory exhaustion on oversized constrained collections
  zod: 4.6.7
  # GHSA-27r3-jxmh-p828: DoS via trailing bytes after compressed request body
  body-parser: '>=2.4.0'
  # GHSA-7589-6fvf-x4pw: ReDoS in Schema.TemplateLiteral (Prisma @prisma/config). Stay on 3.x; effect 4 breaks Prisma config load.
  effect: 4.1.6
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  lodash: '>=4.18.1'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  workerd: true
